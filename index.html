<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olávio Soares | Links</title>

    <!-- Carregando Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Carregando Google Fonts: Montserrat para uma tipografia limpa e moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Carregando FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Configuração de tema do Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0f172a', /* Fundo escuro elegante (slate-900) */
                        btnBg: '#1e293b', /* Fundo dos botões (slate-800) */
                        btnHover: '#334155', /* Hover dos botões (slate-700) */
                    }
                }
            }
        }
    </script>

    <style>
        #photo {
            background-image: url("os.jpg");
            background-position: center;
            background-size: cover;
        }

        /* Efeito de gradiente no hover dos botões */
        .btn-link {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, #8b5cf6, #ec4899);
            /* Gradiente roxo/rosa remetendo ao Insta/TikTok */
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-link:hover::before {
            opacity: 1;
        }

        .btn-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.15);
            border-color: transparent;
        }
    </style>
</head>

<body
    class="bg-darkBg text-white min-h-screen flex flex-col items-center justify-center font-sans relative overflow-x-hidden">

    <!-- Efeito de luz sutil no fundo -->
    <div
        class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-purple-600/20 rounded-full blur-[120px] -z-10 pointer-events-none">
    </div>

    <main class="w-full max-w-md px-6 py-12 flex flex-col items-center z-10">

        <!-- Perfil -->
        <div class="flex flex-col items-center mb-10">
            <!-- Avatar (Iniciais estilizadas) -->
            <div
                class="w-28 h-28 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center mb-4 shadow-lg shadow-purple-500/30 p-1">
                <div id="photo" class="w-full h-full bg-darkBg rounded-full flex items-center justify-center">
                </div>
            </div>

            <!-- Nome e Título -->
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight mb-1 text-center">
                Olávio Soares
            </h1>
            <p class="text-slate-400 text-sm md:text-base font-medium tracking-wide flex items-center gap-2">
                Digital Influencer
                <i class="fa-solid fa-circle-check text-blue-400 text-sm" title="Verificado"></i>
            </p>
        </div>

        <!-- Lista de Links -->
        <div class="w-full flex flex-col gap-4">

            <!-- Link 1: Instagram -->
            <a href="https://www.instagram.com/olavio__soares" target="_blank" rel="noopener noreferrer"
                class="btn-link w-full bg-btnBg border border-slate-700/50 rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div
                        class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-white/20 transition-colors">
                        <i class="fa-brands fa-instagram text-xl"></i>
                    </div>
                    <div class="flex flex-col text-left">
                        <span class="font-semibold text-lg leading-tight">Instagram</span>
                        <span
                            class="text-slate-300 text-sm group-hover:text-white/90 transition-colors">@olavio__soares</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-white transition-colors"></i>
            </a>

            <!-- Link 2: TikTok -->
            <a href="https://www.tiktok.com/@olaviosoaress" target="_blank" rel="noopener noreferrer"
                class="btn-link w-full bg-btnBg border border-slate-700/50 rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div
                        class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-white/20 transition-colors">
                        <i class="fa-brands fa-tiktok text-xl"></i>
                    </div>
                    <div class="flex flex-col text-left">
                        <span class="font-semibold text-lg leading-tight">TikTok</span>
                        <span
                            class="text-slate-300 text-sm group-hover:text-white/90 transition-colors">@olaviosoaress</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-white transition-colors"></i>
            </a>

            <!-- Link 3: Contato Comercial -->
            <a href="https://wa.me/5563991398664" target="_blank" rel="noopener noreferrer"
                class="btn-link w-full bg-btnBg border border-slate-700/50 rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div
                        class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-white/20 transition-colors">
                        <i
                            class="fa-brands fa-whatsapp text-xl text-green-400 group-hover:text-white transition-colors"></i>
                    </div>
                    <div class="flex flex-col text-left">
                        <span class="font-semibold text-lg leading-tight">Contato Comercial</span>
                        <span class="text-slate-300 text-sm group-hover:text-white/90 transition-colors">ELO
                            Assessoria</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-white transition-colors"></i>
            </a>

        </div>

        <!-- Rodapé -->
        <footer class="mt-12 text-center">
            <p class="text-slate-500 text-xs font-medium uppercase tracking-wider">
                © 2026 Olávio Soares
            </p>
        </footer>

    </main>
</body>

</html>
